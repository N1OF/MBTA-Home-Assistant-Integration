title: MBTA Departures
views:
  - title: Departures
    path: departures
    icon: mdi:train
    cards:
      - type: markdown
        title: South Station — Red Line
        content: |-
          {% set e = 'sensor.mbta_south_station_red' %}
          {% if states(e) in ['unavailable', 'unknown'] %}
          No upcoming departures or data unavailable.
          {% else %}
          | Destination | Departs | Track | Source |
          | :--- | :--- | :--- | :--- |
          {% for d in state_attr(e, 'departures') or [] %}
          | {{ d.destination }} | {{ as_local(as_datetime(d.departure_time)).strftime('%I:%M %p') }} ({{ [0, ((as_timestamp(d.departure_time)-as_timestamp(now())) / 60) | round(0, 'ceil') | int] | max }} min) | {{ d.track or '—' }} | {{ 'Live' if d.realtime else 'Schedule' }} |
          {% endfor %}
          {% endif %}
